<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FamilyCraft</title>
<meta name="description" content="FamilyCraft: build together, test it against the flood. A family co-op building game.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6fd0ff">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mitr:wght@400;500;600&display=swap">
<style>
/* Bright clay-toy game UI: white floating pills, icons first, almost no sentences. Single committed look. */
:root{
  --ink:#16213e; --soft:#5b6785; --card:rgba(255,255,255,.94); --line:#e6ecf5;
  --go:#22c55e; --go-d:#15a34a; --sun:#ffc93c; --sun-d:#e5a800; --blue:#2f7bff; --coral:#ff5d6c; --ok-bg:#dcfce7; --ok:#15803d; --bad-bg:#ffe1e4; --bad:#d92d45;
  --font:"Fredoka","Mitr",system-ui,sans-serif;
  --shadow:0 8px 22px rgba(22,60,120,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none}
body{background:
  radial-gradient(40% 16% at 18% 16%,rgba(255,255,255,.9),transparent 70%),
  radial-gradient(34% 13% at 78% 10%,rgba(255,255,255,.8),transparent 70%),
  radial-gradient(30% 10% at 60% 26%,rgba(255,255,255,.55),transparent 70%),
  linear-gradient(#63c8ff 0%,#a8e4ff 46%,#e4f9ff 78%,#fff7d6 100%)}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{background:var(--card);border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center}
button{font-family:var(--font);cursor:pointer;border:0;color:var(--ink);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.clean .hud,.clean #setup{display:none!important}

#tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center}
.logo{padding:8px 16px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo span{color:var(--go)}
.rb{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:19px;display:grid;place-items:center}
.rb[aria-pressed="true"]{background:var(--ink);color:#fff}
.lang{padding:4px;gap:2px}
.lang button{background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;color:var(--soft)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

#tc{top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.flood{padding:8px 15px;font-size:18px;font-weight:700;gap:6px;background:#1b9cf2;color:#fff}
.chip{padding:6px 8px 6px 6px;gap:7px;font-size:15px}
.chip .dot{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.16);flex:none}
.chip .nm{font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{display:flex;align-items:center;gap:5px;background:#f1f5fb;border-radius:999px;padding:4px 10px 4px 7px;font-weight:600;font-variant-numeric:tabular-nums;font-size:14.5px}
.g.ok{background:var(--ok-bg);color:var(--ok)}
.g.bad{background:var(--bad-bg);color:var(--bad)}
.ic{width:17px;height:17px;flex:none;display:block}
.ic.floor{background:#f29b4c;border-radius:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.ic.roof{background:#ff4f6d;clip-path:polygon(50% 5%,100% 92%,0 92%)}
.ic.coin{background:var(--sun);border-radius:50%;box-shadow:inset 0 -3px 0 var(--sun-d)}

#tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
#timer{padding:9px 14px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
#timer.low{background:var(--bad-bg);color:var(--bad)}
.roles{padding:4px;gap:2px}
.roles button{background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--soft);display:flex;gap:6px;align-items:center}
.roles button[aria-pressed="true"]{background:var(--ink);color:#fff}

#fab{right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:10px;justify-items:center}
#test{width:92px;height:92px;border-radius:50%;background:#35b8ff;box-shadow:0 7px 0 #1590dd,var(--shadow);font-size:40px;display:grid;place-items:center;line-height:1}
#test:active{transform:translateY(4px);box-shadow:0 3px 0 #1590dd}
#test[disabled]{filter:grayscale(.7);opacity:.7;cursor:not-allowed}
#testLbl{font-weight:700;font-size:15px;background:var(--card);padding:3px 12px;border-radius:999px;box-shadow:var(--shadow);margin-top:-2px}
.mini-row{display:grid;gap:8px;margin-top:6px}

#bar{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:9px;max-width:calc(100vw - 20px);overflow-x:auto;background:var(--card);border-radius:26px;box-shadow:var(--shadow)}
.slot{width:78px;flex:none;padding:7px 4px 6px;border-radius:18px;background:#f1f5fb;display:grid;justify-items:center;gap:3px;position:relative;transition:transform .12s}
.slot .sw{width:36px;height:36px;border-radius:11px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.4);display:grid;place-items:center;font-size:19px}
.slot .nm{font-size:11.5px;font-weight:500;color:var(--soft);white-space:nowrap}
.slot .bd{display:flex;gap:3px;white-space:nowrap;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.slot .bd span{display:inline-flex;align-items:center;gap:2px;background:#fff;border-radius:999px;padding:1px 6px;color:var(--ink)}
.slot .bd .c::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sun);box-shadow:inset 0 -2px 0 var(--sun-d)}
.slot[aria-pressed="true"]{background:var(--ink);transform:translateY(-6px)}
.slot[aria-pressed="true"] .nm{color:#fff}
.noload .cap{display:none!important}

#legend{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:10px 14px;display:none;gap:5px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);font-size:13px;font-weight:500}
#legend.show{display:grid}
#legend span{display:flex;gap:8px;align-items:center}
#legend i{width:14px;height:14px;border-radius:5px;flex:none}

#toast{left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(520px,calc(100vw - 24px));padding:10px 18px 10px 12px;display:none;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:999px;box-shadow:var(--shadow);font-size:14.5px;font-weight:500;line-height:1.35}
#toast.show{display:flex}
#toast .ti{font-size:24px;line-height:1}

#result{inset:0;display:none;place-items:end center;z-index:20;padding:12px;pointer-events:none}
#result.show{display:grid}
.sheet2{pointer-events:auto;width:min(640px,100%);background:#fff;border-radius:28px;box-shadow:0 14px 40px rgba(22,60,120,.3);padding:18px 20px 16px;position:relative;overflow:hidden;animation:up .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet2 h2{margin:0 0 10px;font-size:26px;font-weight:700;text-align:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pcol{border-radius:20px;padding:12px 14px;background:#f1f5fb;display:grid;gap:8px;justify-items:center}
.pcol.win{background:#fff6d6;box-shadow:inset 0 0 0 3px var(--sun)}
.pcol h3{margin:0;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
.pcol h3 i{width:20px;height:20px;border-radius:50%}
.stars{font-size:34px;letter-spacing:4px;color:var(--sun);line-height:1;text-shadow:0 2px 0 var(--sun-d)}
.stars s{color:#d6deea;text-decoration:none;text-shadow:none}
.rowg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dmg{font-size:13px;font-weight:600;color:var(--bad)}
.learn{margin-top:10px;background:#eaf4ff;border-radius:16px;padding:10px 14px;font-size:14.5px;font-weight:500;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.learn small{display:block;color:var(--soft);font-size:11.5px;margin-top:2px}
.sheet2 .row{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.big{padding:12px 22px;border-radius:999px;font-size:16px;background:var(--go);color:#fff;box-shadow:0 5px 0 var(--go-d)}
.big.alt{background:#f1f5fb;color:var(--ink);box-shadow:0 5px 0 #d6deea}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-d)}
.conf{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 2.2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:.2}}

/* setup */
#setup{position:fixed;inset:0;z-index:30;display:grid;place-items:start center;background:rgba(120,205,255,.5);backdrop-filter:blur(8px);overflow:auto;padding:14px}
.sheet{margin:auto;width:min(700px,100%);background:#fff;border-radius:32px;box-shadow:0 18px 50px rgba(22,60,120,.3);padding:22px;display:grid;gap:18px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sheet h1{font-weight:700;font-size:28px;margin:0}
.sheet h1 span{color:var(--go)}
.sheet .lang{box-shadow:none;background:#f1f5fb}
.lbl{font-size:13px;font-weight:600;color:var(--soft);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prof{background:#f1f5fb;border-radius:24px;padding:14px 8px 10px;display:grid;justify-items:center;gap:6px;position:relative;cursor:pointer;transition:transform .12s}
.prof[aria-pressed="true"]{background:#e3f0ff;box-shadow:inset 0 0 0 4px var(--blue);transform:translateY(-3px)}
.prof .who{font-size:17px;font-weight:600}
.prof .badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;background:var(--blue);color:#fff;border-radius:999px;padding:1px 9px;display:none}
.prof[aria-pressed="true"] .badge{display:block}
.mini{width:62px;height:92px;position:relative}
.mini i{position:absolute;display:block}
.mini .head{left:9px;top:12px;width:44px;height:38px;border-radius:13px;background:var(--skin);box-shadow:inset 0 11px 0 var(--hair)}
.mini .eye{top:33px;width:6px;height:7px;background:#222;border-radius:3px}
.mini .body{left:11px;top:52px;width:40px;height:26px;border-radius:10px;background:var(--shirt);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.mini .legs{left:17px;top:78px;width:28px;height:14px;border-radius:0 0 7px 7px;background:#3b4a63}
.mini .hat{display:none}
.mini[data-hat="cap"] .hat{display:block;left:7px;top:5px;width:48px;height:14px;border-radius:12px 12px 4px 4px;background:#ff5d6c;box-shadow:16px 7px 0 -3px #ff5d6c}
.mini[data-hat="ngob"] .hat{display:block;left:-2px;top:6px;width:66px;height:12px;background:#f2cf7a;border-radius:50% 50% 6px 6px;box-shadow:0 -7px 0 -3px #f2cf7a}
.mini[data-hat="helmet"] .hat{display:block;left:6px;top:3px;width:50px;height:17px;background:var(--sun);border-radius:14px 14px 4px 4px}
.dress{font-size:13px;background:#fff;border-radius:999px;padding:4px 12px;color:var(--soft)}
#editor{background:#f1f5fb;border-radius:20px;padding:14px;display:none;gap:10px 14px;grid-template-columns:auto 1fr;align-items:center;font-size:14px;font-weight:500}
#editor.show{display:grid}
#editor input[type=text],#editor select{font-family:var(--font);font-size:15px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%;max-width:230px}
.sw6{display:flex;gap:8px;flex-wrap:wrap}
.sw6 button{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.sw6 button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tiles button{background:#f1f5fb;border-radius:18px;padding:10px 16px;font-size:15px;display:flex;gap:8px;align-items:center}
.tiles button .e{font-size:22px}
.tiles button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tiles button[disabled]{opacity:.35;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sum{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sum span{background:#f1f5fb;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
details{font-size:14px;font-weight:500;margin-top:8px}
details summary{cursor:pointer;color:var(--blue)}
details label{display:grid;gap:2px;margin-top:8px}
details input[type=range]{width:100%;accent-color:var(--blue)}
#go{justify-self:center;font-size:22px;padding:14px 46px}
.onl{background:#f1f5fb;border-radius:22px;padding:14px;display:grid;gap:10px;margin-top:10px}
.rowx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.code{font-size:36px;font-weight:700;letter-spacing:.14em;background:#fff;border-radius:16px;padding:2px 16px;-webkit-user-select:all;user-select:all}
#codeIn{font-family:var(--font);font-size:22px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;width:128px;text-align:center;padding:7px;border-radius:14px;border:2px solid var(--line);color:var(--ink);background:#fff}
#qr{width:128px;height:128px;background:#fff;border-radius:16px;padding:8px;flex:none}
#qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.mate{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 14px;font-weight:600;min-height:46px}
.mate .dot{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.16);flex:none}
.via{font-size:13px;color:var(--soft);font-weight:500}
.btn{background:#fff;border-radius:999px;padding:9px 16px;font-size:15px;box-shadow:0 3px 0 #d6deea}
.btn.go{background:var(--blue);color:#fff;box-shadow:0 3px 0 #1c5fd6}
.btn[disabled],.big[disabled]{opacity:.45;filter:grayscale(.5);cursor:not-allowed}
.onl .tiles button{background:#fff;padding:8px 14px}
.onl .tiles button[aria-pressed="true"]{background:var(--ink)}
.guest #modes,.guest #ages,.guest #timers,.guest details,.guest .sum{opacity:.5;pointer-events:none}
#netPill{padding:8px 13px 8px 10px;gap:7px;font-size:14px;font-weight:600;max-width:150px}
#netPill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#netPill .led{width:11px;height:11px;border-radius:50%;background:var(--coral);flex:none}
#netPill.on .led{background:var(--go)}
#tr{flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
@media (max-width:1180px){
  #tc{top:calc(64px + env(safe-area-inset-top,0px))}
  #toast{top:calc(122px + env(safe-area-inset-top,0px));border-radius:22px}
}
@media (max-width:820px){
  #fab{top:auto;transform:none;bottom:calc(118px + env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px))}
  #test{width:72px;height:72px}
  #test svg{width:42px;height:42px}
  .mini-row{grid-auto-flow:column}
  #legend{bottom:calc(118px + env(safe-area-inset-bottom,0px))}
  .two{grid-template-columns:1fr}
  .logo{display:none}
  .chip .nm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.rb .ico{width:25px;height:25px;vertical-align:0}
.tiles .e{display:flex}.tiles .e .ico{width:27px;height:27px;vertical-align:0}
.tiles button>.ico{width:19px;height:19px;vertical-align:-4px}
.slot .bd .ico{width:11px;height:11px;vertical-align:-1px}
.slot .sw .ico{width:25px;height:25px;vertical-align:0}
.sum .ico,.sum .ic,details .ico,details .ic{width:16px;height:16px;vertical-align:-3px;display:inline-block}
.big .ico{width:20px;height:20px;vertical-align:-4px}
.btn .ico{width:18px;height:18px;vertical-align:-4px}
.flood .ico{width:24px;height:24px;vertical-align:0}
.roles .ico{width:20px;height:20px;vertical-align:0}
.dress .ico{width:15px;height:15px;vertical-align:-3px}
.dmg .ico{width:15px;height:15px;vertical-align:-3px}
#timer{gap:6px}
#toast .ti.ico{width:34px;height:34px;flex:none}
#toast .who .ico{width:18px;height:18px;vertical-align:0}
.learn>.ico{width:26px;height:26px;flex:none}

/* ---- mission card ---- */
#brief{inset:0;display:grid;place-items:center;z-index:22;padding:14px;pointer-events:auto;background:rgba(150,220,255,.4)}
.brief{width:min(460px,100%);overflow:visible;display:grid;gap:12px;justify-items:center;padding-top:26px}
.brief .who{position:absolute;left:22px;top:-15px;display:flex;gap:7px;align-items:center;background:#ff7a59;color:#fff;border-radius:999px;padding:3px 12px 3px 8px;font-size:13px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.brief .who .ico{width:18px;height:18px;vertical-align:0}
.brief h2{margin:0;font-size:24px}
.goalpic{position:relative;width:220px;height:128px;border-radius:20px;background:linear-gradient(#bfeaff,#e9f9ff);overflow:hidden}
.goalpic i{position:absolute;display:block}
.gp-land{left:0;right:0;bottom:0;height:22px;background:#7fdc4a;box-shadow:inset 0 -12px 0 #e3c088}
.gp-sea{left:0;right:0;bottom:0;height:62px;background:rgba(20,166,234,.5);border-top:3px dashed #0b84e0}
.gp-lv{position:absolute;right:8px;bottom:66px;font-size:15px;color:#0b6fc2;background:#fff;border-radius:999px;padding:0 9px}
.gp-post{bottom:22px;width:12px;height:50px;border-radius:5px;background:#f2cf45}
.gp-floor{left:62px;bottom:72px;width:78px;height:13px;border-radius:5px;background:#f29b4c}
.gp-wall{left:74px;bottom:85px;width:52px;height:18px;border-radius:4px;background:#ffe2b8}
.gp-roof{left:54px;bottom:103px;width:94px;height:13px;border-radius:6px;background:#ff4f6d}
.goals{display:grid;gap:7px;width:100%}
.gl{display:flex;align-items:center;gap:10px;background:#f1f5fb;border-radius:16px;padding:8px 14px;font-weight:500;font-size:15px}
.gl b{font-size:19px;font-weight:700;min-width:26px}
.gl .ic{width:20px;height:20px}
.mine{margin:0;font-size:14.5px;font-weight:600;color:#0b6fc2;text-align:center}
.brief .row{margin-top:2px}

/* ---- level ladder ---- */
.ladder{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ladder button{width:48px;border-radius:14px;background:#f1f5fb;padding:5px 0 4px;display:grid;justify-items:center;font-size:16px;font-weight:700;gap:0;line-height:1.15}
.ladder button small{font-size:9.5px;letter-spacing:1px;color:#cfd8e6}
.ladder button small b{color:var(--sun-d);font-weight:400}
.ladder button[aria-pressed="true"]{background:var(--sel);color:#fff;box-shadow:inset 0 -4px 0 var(--sel-d)}
.ladder button[aria-pressed="true"] small{color:rgba(255,255,255,.45)}
.ladder button[aria-pressed="true"] small b{color:#fff36b}
.guest .ladder{opacity:.5;pointer-events:none}
.big.alt .i-wrench,.big.alt .i-play{filter:brightness(.22)}

/* ---- what each co-op role sees ---- */
.blind .slot .bd{visibility:hidden}
.board #bar{pointer-events:none}
.board .slot[aria-pressed="true"]{background:#eef4fb;box-shadow:none;transform:none}
.chip,.flood{cursor:pointer}
.vs #tc{top:calc(66px + env(safe-area-inset-top,0px))}
.vs #toast{top:calc(138px + env(safe-area-inset-top,0px))}

/* ---- cozy toy pass: sticker buttons, leaf wordmark, speech-bubble hints ---- */
:root{--ink:#2b2a4c;--soft:#6a6f90;--sel:#35b24a;--sel-d:#23913a;--shadow:0 5px 0 rgba(40,90,150,.16),0 12px 24px rgba(22,60,120,.14)}
body{background:
  radial-gradient(40% 16% at 18% 16%,rgba(255,255,255,.95),transparent 70%),
  radial-gradient(34% 13% at 78% 10%,rgba(255,255,255,.85),transparent 70%),
  radial-gradient(30% 10% at 60% 26%,rgba(255,255,255,.6),transparent 70%),
  linear-gradient(#6fd0ff 0%,#aee9ff 46%,#e6fbff 78%,#fff5cc 100%)}
.pill,.rb,#bar,#legend{border:3px solid #fff}
.rb{width:46px;height:46px}
.rb:active,.slot:active,.btn:active,.tiles button:active{transform:translateY(2px)}
.rb[aria-pressed="true"],.lang button[aria-pressed="true"],.roles button[aria-pressed="true"],.tiles button[aria-pressed="true"],.onl .tiles button[aria-pressed="true"]{background:var(--sel);color:#fff;box-shadow:inset 0 -4px 0 var(--sel-d)}
.logo{background:#4fc13d;color:#fff;font-size:20px;gap:0;padding:6px 16px 7px 12px;transform:rotate(-2deg);text-shadow:0 2px 0 rgba(0,0,0,.16)}
.logo span{color:#fff36b}
.logo::before{content:"";margin-right:7px;width:17px;height:17px;background:#fff36b;border-radius:3px 70% 3px 70%;box-shadow:inset -3px -3px 0 rgba(0,0,0,.1)}
.sheet h1{color:#4fc13d;font-size:32px;letter-spacing:-.01em}
.sheet h1 span{color:#ffb020}
.flood{background:#19a8f0;border-color:#fff}
.slot{border-radius:22px;background:#eef4fb}
.slot .sw{border-radius:13px}
.slot[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 4px var(--sun),0 8px 0 rgba(40,90,150,.16)}
.slot[aria-pressed="true"] .nm{color:var(--ink)}
.prof{border-radius:28px}
.prof[aria-pressed="true"]{background:#e9f9e6;box-shadow:inset 0 0 0 4px var(--sel)}
.prof .badge{background:var(--sel)}
.mini .head{left:6px;top:7px;width:50px;height:47px;border-radius:50%;box-shadow:inset 0 15px 0 var(--hair)}
.mini .eye{top:33px;width:6px;height:8px;border-radius:50%}
.mini .body{left:15px;top:53px;width:32px;height:25px;border-radius:14px 14px 10px 10px}
.mini .legs{left:20px;top:77px;width:22px;height:12px}
.mini[data-kind="kid"]::before,.mini[data-kind="kid"]::after{content:"";position:absolute;top:24px;width:17px;height:17px;border-radius:50%;background:var(--hair)}
.mini[data-kind="kid"]::before{left:-7px}.mini[data-kind="kid"]::after{right:-7px}
.mini[data-kind="mom"]::before{content:"";position:absolute;left:20px;top:-5px;width:22px;height:19px;border-radius:50%;background:var(--hair)}
.mini .head{z-index:1}.mini .eye{z-index:2}.mini .hat{z-index:3}
#setup{background:rgba(150,220,255,.55)}
#toast{background:#fff;color:var(--ink);border:3px solid #fff;border-radius:24px;padding:16px 20px 12px 16px;top:calc(82px + env(safe-area-inset-top,0px));font-size:15.5px;overflow:visible}
#toast .who{position:absolute;left:16px;top:-15px;display:flex;gap:7px;align-items:center;background:#ff7a59;color:#fff;border-radius:999px;padding:3px 12px 3px 14px;font-size:13px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.12)}
#toast .bface{width:15px;height:14px;border-radius:50%;background:#c9c4f4;box-shadow:-7px -1px 0 -2px #c9c4f4,7px -1px 0 -2px #c9c4f4;margin:0 4px}
#toast::after{content:"";position:absolute;left:44px;bottom:-11px;width:20px;height:20px;background:#fff;border-radius:4px;transform:rotate(45deg)}
#toast>*{position:relative;z-index:1}
#toast .who{position:absolute}
@media (max-width:1180px){ #toast{top:calc(136px + env(safe-area-inset-top,0px));border-radius:24px} }
@media (max-width:820px){
  #tl .lang{display:none}
  .roles button span,#netPill span{display:none}
  .roles button{padding:7px 12px}
  .g{padding:3px 8px 3px 5px;font-size:13.5px;gap:4px}
  .chip .dot{width:24px;height:24px}
  #toast{left:12px;right:12px;transform:none;max-width:none}
}
</style>
</head>

    case 'del': { const v=W.get(m.key); if(state==='build'&&v&&v.built){ W.delete(m.key); beep(220,.08,'square',.03,140); rebuild(); } break; }
    case 'snap': if(state==='build') loadSnap(m.s); break;
    case 'ping': if(okCell(m.x,m.y,m.z)) ping(m.x,m.y,m.z); break;

// ---------- level ladder (flood, budget, weight rule) with best stars kept on this device ----------
const LV=[[2,80,false],[3,70,true],[3,60,true],[4,70,true],[4,60,true],[4,50,true]];
let bestStars=LV.map(()=>0); try{ const b=JSON.parse(localStorage.getItem('fc-best')||'[]'); if(Array.isArray(b)) bestStars=LV.map((_,i)=>Math.min(3,Math.max(0,b[i]|0))); }catch(e){}
const lvNow=()=>LV.findIndex(l=>l[0]===cfg.flood&&l[1]===cfg.budget&&l[2]===cfg.loadRule);
function setLv(i){ const l=LV[i]; if(l){ cfg.flood=l[0]; cfg.budget=l[1]; cfg.loadRule=l[2]; } }
function renderLadder(){ const c=$('ladder'), n=lvNow(); c.innerHTML=''; LV.forEach((l,i)=>{ const b=document.createElement('button'); b.setAttribute('aria-pressed',i===n); b.setAttribute('aria-label',t('s_lv')+' '+(i+1)+', '+bestStars[i]+'/3');
  b.innerHTML=(i+1)+'<small><b>'+'★'.repeat(bestStars[i])+'</b>'+'★'.repeat(3-bestStars[i])+'</small>'; b.onclick=()=>{ setLv(i); syncSetup(); }; c.appendChild(b); }); }
$('next').onclick=()=>{ const lv=lvNow(); if(lv<0||lv>=LV.length-1) return; calm(); setLv(lv+1); start(); if(online()) sendStart(); };

// ---------- setup screen ----------
let editing=null;
function renderProfiles(){
  const c=$('profiles'); c.innerHTML='';
  profiles.forEach(p=>{ const on=net.place==='online', sel=on?p.id===net.meProf:cfg.players.includes(p.id), d=document.createElement('div'); d.className='prof'; d.setAttribute('role','button'); d.tabIndex=0; d.setAttribute('aria-pressed',sel);
    d.innerHTML=`<span class="badge">${on?'★':'P'+(cfg.players.indexOf(p.id)+1)}</span><div class="mini" data-kind="${p.id}" data-hat="${p.hat}" style="--skin:${p.skin};--hair:${p.hair};--shirt:${p.shirt}"><i class="hat"></i><i class="head"></i><i class="eye" style="left:22px"></i><i class="eye" style="left:35px"></i><i class="body"></i><i class="legs"></i></div><span class="who"></span><button class="dress"><i class="ico i-shirt"></i> <span></span></button>`;
    d.querySelector('.who').textContent=pName(p); d.querySelector('.dress span').textContent=t('s_dress');
    const tog=()=>{ if(on){ net.meProf=p.id; meChanged(p); syncSetup(); return; } const i=cfg.players.indexOf(p.id); if(i>=0){ if(cfg.players.length>1) cfg.players.splice(i,1); } else { if(cfg.players.length>=2) cfg.players.shift(); cfg.players.push(p.id); } syncSetup(); };
    d.onclick=e=>{ if(e.target.closest('.dress')){ editing=editing===p.id?null:p.id; renderEditor(); return; } tog(); };
    d.onkeydown=e=>{ if(e.target===d&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tog()} };
    c.appendChild(d); });
}
function renderEditor(){
  const ed=$('editor'), p=editing&&P(editing); ed.classList.toggle('show',!!p); if(!p) return;
  if(document.activeElement!==$('edName')) $('edName').value=p.custom; $('edName').placeholder=t('who_'+p.id); $('edHat').value=p.hat;
  const s=$('edShirt'); s.innerHTML=''; SHIRTS.forEach(col=>{ const b=document.createElement('button'); b.style.background=col; b.setAttribute('aria-label',col); b.setAttribute('aria-pressed',p.shirt===col); b.onclick=()=>{p.shirt=col;renderProfiles();renderEditor();meChanged(p)}; s.appendChild(b); });
}
$('edName').oninput=e=>{ const p=P(editing); if(p){ p.custom=e.target.value.trim(); renderProfiles(); meChanged(p); } };
$('edHat').onchange=e=>{ const p=P(editing); if(p){ p.hat=e.target.value; renderProfiles(); meChanged(p); } };
function syncSetup(){
  const on=net.place==='online';
  if(on){ cfg.mode='coop'; cfg.players=!net.tx||net.host?[net.meProf,'peer']:['peer',net.meProf]; }
  else if(cfg.players.length<2) cfg.mode='solo'; else if(cfg.mode==='solo') cfg.mode='coop';
  document.querySelectorAll('#modes button').forEach(b=>{ const m=b.dataset.mode; b.disabled=on?m!=='coop':(m==='solo')!==(cfg.players.length<2); b.setAttribute('aria-pressed',m===cfg.mode); });
  document.querySelectorAll('#ages button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.age===cfg.age));
  document.querySelectorAll('#timers button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.t===cfg.timer));
  $('flood').value=cfg.flood; $('budget').value=cfg.budget; $('loadRule').checked=cfg.loadRule; $('fl').textContent=cfg.flood; $('bl').textContent=cfg.budget;
  $('sum').innerHTML='<span><i class="ico i-wave"></i> +'+cfg.flood+'</span><span><i class="ic coin"></i> '+cfg.budget+'</span><span><i class="ico i-weight"></i> '+(cfg.loadRule?'✓':'–')+'</span>';
  renderLadder(); renderProfiles(); renderEditor(); renderOnl();
  if(net.host&&net.tx&&net.peer&&state==='setup') sendLobby();
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;syncSetup()});
document.querySelectorAll('#ages button').forEach(b=>b.onclick=()=>{cfg.age=b.dataset.age;Object.assign(cfg,AGE[cfg.age]);syncSetup()});
document.querySelectorAll('#timers button').forEach(b=>b.onclick=()=>{cfg.timer=+b.dataset.t;syncSetup()});
$('flood').oninput=e=>{cfg.flood=+e.target.value;syncSetup()}; $('budget').oninput=e=>{cfg.budget=+e.target.value;syncSetup()}; $('loadRule').onchange=e=>{cfg.loadRule=e.target.checked;syncSetup()};
$('go').onclick=()=>{ if(net.place==='online'&&(!net.tx||!net.host||!net.peer)) return; net.game=Date.now(); $('setup').hidden=true; start(); if(online()) sendStart(); };

function start(){
  genWorld(); buildBoard(); buildDecor(); buildActors(); buildBig(); buildDucks();
  history=[]; role=online()&&!isBuilder()?'glasses':'build'; glassesBtn=false; waterLevel=waterTarget=1; timeLeft=cfg.timer; state='build';
  debris.forEach(d=>fxGroup.remove(d.m)); debris=[]; pings.forEach(p=>fxGroup.remove(p.m)); pings=[];
  $('roleSeg').hidden=cfg.mode!=='coop'; $('glasses').hidden=cfg.mode==='coop'; $('glasses').setAttribute('aria-pressed','false');
  document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.role===role));
  $('sample').hidden=cfg.mode==='versus'; $('timer').hidden=!cfg.timer; $('timerN').textContent=fmt(timeLeft); $('timer').classList.remove('low');
  $('legend').classList.toggle('show',glassesOn()); $('test').disabled=false; $('bar').hidden=false; $('fab').hidden=false; uiRole(); mate.visible=false; netHud();
  testPhase=''; preSnap=null; document.body.classList.toggle('vs',cfg.mode==='versus');
  buildChips(); updateFlood(); rebuild(); fitCam();
  const hi=()=>online()?toast(role==='build'?'hammer':'goggles',t(role==='build'?'t_online_b':'t_online_g',{n:pName(peerProf)}),7000):toast('tui',t('t_'+cfg.mode),6000);
  if(!QS.has('clean')) showBrief(hi);
}

let briefKey='', briefThen=null;
function showBrief(then){ if(QS.has('debug')||QS.has('clean')||(QS.has('auto')&&!QS.has('brief'))){ setTimeout(then,500); return; }
  const k=[cfg.mode,cfg.flood,cfg.budget,role,lang].join('|'); if(k===briefKey){ setTimeout(then,400); return; } briefKey=k; briefThen=then;
  const hid=cfg.mode==='coop'&&role==='build'; $('brLv').textContent='+'+(hid?'?':cfg.flood); $('brCoin').textContent=cfg.budget;
  $('brRole').textContent=cfg.mode==='coop'?t(hid?'m_b':'m_g',{n:cfg.flood}):t('m_s',{n:cfg.flood}); $('brief').hidden=false; $('brGo').focus(); }
function hideBrief(){ $('brief').hidden=true; const f=briefThen; briefThen=null; return f; }
$('brGo').onclick=()=>{ const f=hideBrief(); if(f) f(); };
$('chips').onclick=$('floodPill').onclick=()=>{ if(state==='build'){ briefKey=''; showBrief(()=>{}); } }; // tap the goal counters to see the mission again

// ---------- loop ----------
const clock=new THREE.Clock();
function step(dt,tm){
  waterLevel+=(waterTarget-waterLevel)*Math.min(1,dt*1.5+.01);
  const wv=Math.max(.05,waterLevel-.15); if(water){ water.scale.y=wv; water.position.set(board.w/2,wv/2,board.d/2); }
  if(big.g){ const fy=wv-.55;
    if(big.state==='drop'){ big.vy-=70*dt; big.y+=big.vy*dt; if(big.y<=fy){ big.y=fy; big.state='float'; splash(big.bx,wv,big.bz); waterTarget=floodTop(); if(testPhase==='drop') testPhase='rise'; beep(120,.5,'sine',.09,50); beep(900,.25,'square',.03,300); } }
    else if(big.state==='float'){ big.y=fy+Math.sin(tm*2.2)*.14; big.g.rotation.z=Math.sin(tm*1.7)*.05; }
    else if(big.state==='leave'){ big.y+=34*dt; if(big.y>44){ big.state='away'; big.g.visible=false; } }
    big.g.position.set(big.bx,big.y,big.bz); }
  ducks.forEach(d=>{ d.x+=d.dir*dt*.7; if(d.x<2||d.x>board.w-2) d.dir*=-1; d.g.position.set(d.x,wv-.05+Math.sin(tm*2+d.ph)*.06,d.z); d.g.rotation.y=d.dir>0?Math.PI/2:-Math.PI/2; d.g.rotation.z=Math.sin(tm*2+d.ph)*.08; });
  for(let i=debris.length-1;i>=0;i--){ const d=debris[i]; d.v.y-=18*dt; d.m.position.addScaledVector(d.v,dt); d.m.rotation.x+=d.r.x*dt; d.m.rotation.y+=d.r.y*dt; d.life-=dt; if(d.life<=0){fxGroup.remove(d.m);debris.splice(i,1)} }
  for(let i=pings.length-1;i>=0;i--){ const p=pings[i]; p.life-=dt; p.m.scale.setScalar(1+Math.sin(tm*6)*.08); if(p.life<=0){fxGroup.remove(p.m);pings.splice(i,1)} }
  if(mate.visible){ mateT-=dt; mate.children[1].position.y=1.3+Math.sin(tm*5)*.12; mate.children[1].rotation.y+=dt*3; if(mateT<=0||state!=='build') mate.visible=false; }
  clouds.forEach(c=>{ c.position.x+=dt*c.userData.v; if(c.position.x>board.w+26) c.position.x=-26; });
  actors.forEach((a,i)=>{ const base=Math.max(a.y,wv-a.h), fl=base>a.y+.04; let y=base+Math.abs(Math.sin(tm*2.4+i))*.06; if(a.ring) a.ring.visible=fl; // everyone floats in a swim ring when the water comes
    if(fl){ y=base+Math.sin(tm*2.2+i)*.07; a.a.rotation.z=Math.sin(tm*1.7+i)*.06; } else a.a.rotation.z=0;
    if(a.jump>0){ a.jump-=dt; y=base+Math.abs(Math.sin(tm*9))*.9; a.a.rotation.y+=dt*6; }
    if(a.hop>0){ a.hop-=dt; y=base+Math.sin((1-a.hop/.4)*Math.PI)*.55; }
    if(a.s0===undefined) a.s0=a.a.scale.y; a.a.scale.y=a.s0*(1+Math.sin(tm*2.6+i*1.7)*.022); // breathing
    a.a.position.y=y; });
  if(pop>0){ pop-=dt; hl.visible=true; hl.position.copy(popAt); hl.material.color.set(0xffffff); hl.scale.setScalar(1.04+pop*2.2); if(pop<=0){ hl.scale.setScalar(1.04); hl.visible=false; } }
  if(testPhase==='rise'&&waterLevel>floodTop()-.2){ testPhase='settle'; testT=1.7; testDmg=applyFlood(); history=[]; rebuild(); if(testDmg.some(d=>d.eroded+d.crushed+d.fell)) beep(160,.5,'square',.06,50); }
  else if(testPhase==='settle'){ testT-=dt; if(testT<=0){ testPhase=''; showResult(testPre,testDmg); } }
  if(state==='build'&&cfg.timer>0){ timeLeft-=dt; $('timerN').textContent=fmt(timeLeft); $('timer').classList.toggle('low',timeLeft<30); if(timeLeft<=0) runTest(); }
}
function loop(){ const dt=Math.min(clock.getDelta(),.25); step(dt,clock.elapsedTime); renderer.render(scene,camera); requestAnimationFrame(loop); }

loadModels();
// ---------- boot ----------
resize();
const auto=QS.get('auto');
if(auto&&['versus','coop','solo'].includes(auto)){
  cfg.mode=auto; if(auto==='solo') cfg.players=['kid']; if(QS.get('age')&&AGE[QS.get('age')]){cfg.age=QS.get('age');Object.assign(cfg,AGE[cfg.age])}
  applyLang(); $('setup').hidden=true; start();
  if(QS.has('sample')){ islands.forEach((is,i)=>buildSample(is,i===1)); rebuild(); }
  if(QS.has('role')) document.querySelector('[data-role="glasses"]').click();
  if(QS.has('glasses')&&auto!=='coop') $('glasses').click();
  if(QS.has('test')) later(runTest,600);
} else { applyLang(); genWorld(); buildBoard(); buildDecor(); buildActors(); buildBig(); buildDucks(); buildChips(); rebuild(); fitCam();
  const rq=(QS.get('room')||'').toUpperCase();
  if(/^[A-Z]{4}$/.test(rq)){ let sv=null; try{ sv=JSON.parse(sessionStorage.getItem('fc-net')||'null'); }catch(e){}
    net.place='online'; net.localPlayers=cfg.players.slice();
    if(sv&&sv.code===rq&&/^[A-Z]{8}$/.test(sv.id||'')){ net.id=sv.id; if(P(sv.me)) net.meProf=sv.me; enterRoom(rq,!!sv.host); } else { net.meProf='dad'; enterRoom(rq,false); }
    syncSetup(); } }
if(QS.has('debug')) window.__fc={ev:c=>eval(c),put:(x,y,z,ti)=>{ tool=ti; act({key:null,x,y:y-1,z,px:x,py:y,pz:z},false); },erase:(x,y,z)=>act({key:K(x,y,z),x,y,z,px:x,py:y+1,pz:z},true),tap:(x,y,z)=>act({key:null,x,y:y-1,z,px:x,py:y,pz:z},false),
  snap:()=>snapData().sort().join('|'),info:()=>({state,role,host:net.host,builder:isBuilder(),peer:net.peer?pName(peerProf):null,gone:net.gone,via:net.via,code:net.code,flood:$('floodN').textContent,pings:pings.length,players:cfg.players.join('+'),timer:cfg.timer,age:cfg.age,title:$('resH').textContent,stars:[...document.querySelectorAll('#resCols .stars')].map(e=>e.textContent.length-e.querySelector('s').textContent.length).join(',')}),ground:(x,z)=>groundY(x,z),isle:()=>islands[0]};
if(REC){ muted=true; window.DURATION=7; window.seek=t=>{ while(simT<t-1e-6){ simT+=1/30; timers.forEach(x=>{ if(!x.done&&x.at<=simT){x.done=1;x.fn()} }); step(1/30,simT); } theta=-.5+simT*.1; radius=44; placeCam(); renderer.render(scene,camera); }; }
else loop();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(actors.length) buildActors(); });
})();
</script>
</body>
</html>
